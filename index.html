<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Кейсы</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Верхняя панель -->
    <header class="top-bar">
        <div class="user-info">
            <span class="avatar">👤</span>
            <span class="username">Игрок</span>
        </div>
        <div class="balance-box">
            <span id="balance">1000</span> ⭐
        </div>
    </header>

    <!-- Главный экран (Кейсы) -->
    <div class="screen active" id="main-screen">
        <h2 class="section-title">Выбери кейс</h2>
        <div class="cases-grid" id="cases-grid">
            <!-- Кейсы будут вставлены через JS -->
        </div>
        <button class="btn-collection" onclick="showCollection()">🎒 Моя коллекция</button>
    </div>

    <!-- Экран рулетки -->
    <div class="screen hidden" id="roulette-screen">
        <h2 id="current-case-name">Открываем...</h2>
        <div class="roulette-wrapper">
            <div class="roulette-marker"></div>
            <div class="roulette-track" id="roulette-track">
                <!-- Элементы рулетки -->
            </div>
        </div>
        <button class="btn-main hidden" id="claim-btn" onclick="finishOpening()">Забрать</button>
    </div>

    <!-- Экран коллекции -->
    <div class="screen hidden" id="collection-screen">
        <h2 class="section-title">Мои NFT</h2>
        <div class="inventory-grid" id="inventory-grid"></div>
        <button class="btn-main" onclick="showMain()">Назад к кейсам</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
