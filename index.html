<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Кейсы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #09090b; color: #fff; padding-bottom: 70px; }
        
        .header { display: flex; justify-content: space-between; padding: 15px; background: #18181b; border-bottom: 1px solid #27272a; position: sticky; top: 0; z-index: 10; }
        .lvl { background: #8b5cf6; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .money { background: #27272a; padding: 5px 15px; border-radius: 20px; font-weight: bold; color: #fbbf24; }

        .screen { display: none; padding: 15px; }
        .screen.active { display: block; }
        h2 { margin-bottom: 15px; font-size: 20px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .box-card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 15px; text-align: center; cursor: pointer; transition: 0.1s; }
        .box-card:active { transform: scale(0.95); }
        
        .box-icon { width: 80px; height: 80px; margin: 0 auto 10px; background: linear-gradient(180deg, #27272a, #09090b); border-radius: 12px; border: 2px solid var(--c); box-shadow: 0 0 15px var(--c), inset 0 0 10px var(--c); display: flex; justify-content: center; align-items: center; font-size: 40px; }
        .box-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .box-price { background: #27272a; padding: 4px 10px; border-radius: 10px; font-size: 12px; color: #fbbf24; display: inline-block; }

        .roulette-container { height: 130px; background: #000; border: 2px solid #8b5cf6; border-radius: 12px; position: relative; overflow: hidden; margin: 30px 0; }
        .marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #ef4444; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 10px #ef4444; }
        .track { display: flex; height: 100%; align-items: center; position: absolute; }
        .roll-item { min-width: 110px; height: 110px; margin: 0 5px; background: #18181b; border: 1px solid #27272a; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px; }
        
        .nft-img { width: 65px; height: 65px; border-radius: 50%; background: #000; border: 2px solid var(--c); box-shadow: 0 0 15px var(--c); margin-bottom: 5px; display: flex; justify-content: center; align-items: center; font-size: 35px; }
        .nft-name { font-size: 10px; font-weight: bold; text-align: center; }

        .inv-item { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .inv-item .nft-img { width: 70px; height: 70px; font-size: 40px; }
        .sell-btn { background: #ef4444; color: white; border: none; padding: 8px; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; font-size: 12px; }

        .btn { background: #8b5cf6; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #18181b; border-top: 1px solid #27272a; display: flex; justify-content: space-around; padding: 10px 0; z-index: 10; }
        .nav-btn { background: none; border: none; color: #71717a; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-btn.active { color: #8b5cf6; }
        .nav-btn span { font-size: 20px; }
        
        .task { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .input { width: 100%; padding: 12px; background: #000; border: 1px solid #27272a; color: white; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="lvl" id="lvl">Ур. 1</div>
        <div class="money"><span id="bal">1000</span> ⭐</div>
    </div>

    <div class="screen active" id="screen-cases">
        <h2>Коллекции</h2>
        <div class="grid" id="cases-grid"></div>
    </div>

    <div class="screen" id="screen-roll">
        <h2 id="roll-title">Открываем...</h2>
        <div class="roulette-container">
            <div class="marker"></div>
            <div class="track" id="track"></div>
        </div>
        <button class="btn hidden" id="claim-btn" onclick="claim()">Забрать NFT</button>
    </div>

    <div class="screen" id="screen-inv">
        <h2>Инвентарь</h2>
        <div class="grid" id="inv-grid"></div>
    </div>

    <div class="screen" id="screen-tasks">
        <h2>Задания</h2>
        <div id="tasks-list"></div>
    </div>

    <div class="screen" id="screen-prof">
        <h2>Профиль</h2>
        <input type="text" class="input" id="promo" placeholder="Промокод...">
        <button class="btn" onclick="promo()">Активировать</button>
        <button class="btn" style="background:#27272a; margin-top:20px;" onclick="alert('Трейды появятся позже!')">Трейды</button>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="tab('cases', this)"><span>📦</span>Кейсы</button>
        <button class="nav-btn" onclick="tab('inv', this)"><span>🎒</span>Инвентарь</button>
        <button class="nav-btn" onclick="tab('tasks', this)"><span>📋</span>Задания</button>
        <button class="nav-btn" onclick="tab('prof', this)"><span>👤</span>Профиль</button>
    </div>

    <script>
        let p = { bal: 1000, lvl: 1, xp: 0, inv: [], promo: false };

        // 30 УНИКАЛЬНЫХ ЯЩИКОВ (С эмодзи вместо картинок)
        const allCases = [
            { id: 'cats', name: 'Ящик Кошек', price: 50, icon: '🐱', color: '#f59e0b', drops: [ { name: 'Сфинкс', emoji: '🐈' }, { name: 'Британец', emoji: '🐈‍⬛' }, { name: 'Мейн-кун', emoji: '🐱' }, { name: 'Кот', emoji: '😺' } ]},
            { id: 'dogs', name: 'Ящик Собак', price: 50, icon: '🐶', color: '#b45309', drops: [ { name: 'Корги', emoji: '🐕' }, { name: 'Хаски', emoji: '🐺' }, { name: 'Доберман', emoji: '🐕‍🦺' }, { name: 'Бульдог', emoji: '🐶' } ]},
            { id: 'flowers', name: 'Ящик Цветов', price: 80, icon: '🌸', color: '#ec4899', drops: [ { name: 'Роза', emoji: '🌹' }, { name: 'Тюльпан', emoji: '🌷' }, { name: 'Сакура', emoji: '🌸' }, { name: 'Орхидея', emoji: '🌺' } ]},
            { id: 'space', name: 'Ящик Космоса', price: 100, icon: '🚀', color: '#8b5cf6', drops: [ { name: 'Планета', emoji: '🪐' }, { name: 'Ракета', emoji: '🚀' }, { name: 'Луна', emoji: '🌙' }, { name: 'Галактика', emoji: '🌌' } ]},
            { id: 'ocean', name: 'Ящик Океана', price: 100, icon: '🌊', color: '#3b82f6', drops: [ { name: 'Дельфин', emoji: '🐬' }, { name: 'Акула', emoji: '🦈' }, { name: 'Кит', emoji: '🐋' }, { name: 'Осьминог', emoji: '🐙' } ]},
            { id: 'dragons', name: 'Ящик Драконов', price: 150, icon: '🐉', color: '#ef4444', drops: [ { name: 'Огнедышащий', emoji: '🔥' }, { name: 'Ледяной', emoji: '❄️' }, { name: 'Теневой', emoji: '🌑' }, { name: 'Золотой', emoji: '🐉' } ]},
            { id: 'food', name: 'Ящик Еды', price: 40, icon: '🍕', color: '#f97316', drops: [ { name: 'Пицца', emoji: '🍕' }, { name: 'Бургер', emoji: '🍔' }, { name: 'Суши', emoji: '🍣' }, { name: 'Торт', emoji: '🍰' } ]},
            { id: 'treasure', name: 'Ящик Сокровищ', price: 200, icon: '💎', color: '#10b981', drops: [ { name: 'Алмаз', emoji: '💎' }, { name: 'Изумруд', emoji: '🟩' }, { name: 'Рубин', emoji: '🟥' }, { name: 'Сапфир', emoji: '🟦' } ]},
            { id: 'cuties', name: 'Ящик Милашек', price: 80, icon: '🧸', color: '#f472b6', drops: [ { name: 'Мишка', emoji: '🧸' }, { name: 'Кролик', emoji: '🐰' }, { name: 'Панда', emoji: '🐼' }, { name: 'Коала', emoji: '🐨' } ]},
            { id: 'magic', name: 'Ящик Магии', price: 120, icon: '🔮', color: '#a855f7', drops: [ { name: 'Шар', emoji: '🔮' }, { name: 'Зелье', emoji: '🧪' }, { name: 'Посох', emoji: '🪄' }, { name: 'Гримуар', emoji: '📖' } ]},
            { id: 'cars', name: 'Ящик Тачек', price: 300, icon: '🚗', color: '#ef4444', drops: [ { name: 'Тесла', emoji: '⚡' }, { name: 'Феррари', emoji: '🏎️' }, { name: 'Ламбо', emoji: '🚗' }, { name: 'Порше', emoji: '🚙' } ]},
            { id: 'tech', name: 'Ящик Техники', price: 250, icon: '📱', color: '#64748b', drops: [ { name: 'iPhone', emoji: '📱' }, { name: 'MacBook', emoji: '💻' }, { name: 'PlayStation', emoji: '🎮' }, { name: 'Наушники', emoji: '🎧' } ]},
            { id: 'owls', name: 'Ящик Сов', price: 110, icon: '🦉', color: '#d97706', drops: [ { name: 'Белая Сова', emoji: '🦉' }, { name: 'Сипуха', emoji: '🦅' }, { name: 'Филин', emoji: '🦆' }, { name: 'Неясыть', emoji: '🦜' } ]},
            { id: 'rabbits', name: 'Ящик Кроликов', price: 70, icon: '🐰', color: '#fbcfe8', drops: [ { name: 'Белый', emoji: '🐇' }, { name: 'Серый', emoji: '🐰' }, { name: 'Черный', emoji: '🐈‍⬛' }, { name: 'Розовый', emoji: '🐷' } ]},
            { id: 'coins', name: 'Ящик Монет', price: 180, icon: '🪙', color: '#fbbf24', drops: [ { name: 'Бронза', emoji: '🟤' }, { name: 'Серебро', emoji: '⚪' }, { name: 'Золото', emoji: '🟡' }, { name: 'Платина', emoji: '🪙' } ]},
            { id: 'fish', name: 'Ящик Рыб', price: 60, icon: '🐟', color: '#0ea5e9', drops: [ { name: 'Клоун', emoji: '🐠' }, { name: 'Скалярия', emoji: '🐟' }, { name: 'Золотая', emoji: '🐡' }, { name: 'Меченосец', emoji: '🦈' } ]},
            { id: 'birds', name: 'Ящик Птиц', price: 90, icon: '🦜', color: '#10b981', drops: [ { name: 'Попугай', emoji: '🦜' }, { name: 'Орел', emoji: '🦅' }, { name: 'Феникс', emoji: '🔥' }, { name: 'Сокол', emoji: '🦅' } ]},
            { id: 'fruits', name: 'Ящик Фруктов', price: 30, icon: '🍎', color: '#ef4444', drops: [ { name: 'Яблоко', emoji: '🍎' }, { name: 'Банан', emoji: '🍌' }, { name: 'Апельсин', emoji: '🍊' }, { name: 'Виноград', emoji: '🍇' } ]},
            { id: 'hearts', name: 'Ящик Сердец', price: 150, icon: '❤️', color: '#dc2626', drops: [ { name: 'Красное', emoji: '❤️' }, { name: 'Розовое', emoji: '💖' }, { name: 'Золотое', emoji: '💛' }, { name: 'Черное', emoji: '🖤' } ]},
            { id: 'mushrooms', name: 'Ящик Грибов', price: 45, icon: '🍄', color: '#f87171', drops: [ { name: 'Мухомор', emoji: '🍄' }, { name: 'Белый', emoji: '🍄' }, { name: 'Лисичка', emoji: '🍄' }, { name: 'Поганка', emoji: '🍄' } ]},
            { id: 'weapons', name: 'Ящик Оружия', price: 500, icon: '⚔️', color: '#94a3b8', drops: [ { name: 'Меч', emoji: '⚔️' }, { name: 'Топор', emoji: '🪓' }, { name: 'Лук', emoji: '🏹' }, { name: 'Копье', emoji: '🔱' } ]},
            { id: 'drinks', name: 'Ящик Напитков', price: 35, icon: '☕', color: '#78350f', drops: [ { name: 'Кофе', emoji: '☕' }, { name: 'Чай', emoji: '🍵' }, { name: 'Кола', emoji: '🥤' }, { name: 'Сок', emoji: '🧃' } ]},
            { id: 'clothes', name: 'Ящик Одежды', price: 220, icon: '👕', color: '#60a5fa', drops: [ { name: 'Футболка', emoji: '👕' }, { name: 'Худи', emoji: '🧥' }, { name: 'Кроссовки', emoji: '👟' }, { name: 'Кепка', emoji: '🧢' } ]},
            { id: 'weather', name: 'Ящик Погоды', price: 130, icon: '⛅', color: '#94a3b8', drops: [ { name: 'Солнце', emoji: '☀️' }, { name: 'Дождь', emoji: '🌧️' }, { name: 'Снег', emoji: '❄️' }, { name: 'Молния', emoji: '⚡' } ]},
            { id: 'insects', name: 'Ящик Насекомых', price: 55, icon: '🐞', color: '#ef4444', drops: [ { name: 'Божья Коровка', emoji: '🐞' }, { name: 'Бабочка', emoji: '🦋' }, { name: 'Пчела', emoji: '🐝' }, { name: 'Муравей', emoji: '🐜' } ]},
            { id: 'holiday', name: 'Ящик Праздника', price: 170, icon: '🎄', color: '#10b981', drops: [ { name: 'Санта', emoji: '🎅' }, { name: 'Тыква', emoji: '🎃' }, { name: 'Яйцо', emoji: '🥚' }, { name: 'Елка', emoji: '🎄' } ]},
            { id: 'royal', name: 'Ящик Короля', price: 600, icon: '👑', color: '#fbbf24', drops: [ { name: 'Корона', emoji: '👑' }, { name: 'Скипетр', emoji: '🪄' }, { name: 'Трон', emoji: '🪑' }, { name: 'Мантия', emoji: '🧥' } ]},
            { id: 'sharks', name: 'Ящик Акул', price: 140, icon: '🦈', color: '#64748b', drops: [ { name: 'Тигровая', emoji: '🦈' }, { name: 'Белая', emoji: '🦈' }, { name: 'Молот', emoji: '🔨' }, { name: 'Китовая', emoji: '🐋' } ]},
            { id: 'mythic', name: 'Ящик Мифов', price: 800, icon: '🦅', color: '#a855f7', drops: [ { name: 'Феникс', emoji: '🔥' }, { name: 'Грифон', emoji: '🦅' }, { name: 'Единорог', emoji: '🦄' }, { name: 'Пегас', emoji: '🐴' } ]},
            { id: 'legendary', name: 'Ящик Легенд', price: 1000, icon: '🏆', color: '#fde047', drops: [ { name: 'Кубок', emoji: '🏆' }, { name: 'Медаль', emoji: '🏅' }, { name: 'Звезда', emoji: '🌟' }, { name: 'Алмаз', emoji: '💎' } ]}
        ];

        function upd() {
            document.getElementById('bal').innerText = p.bal;
            document.getElementById('lvl').innerText = `Ур. ${p.lvl}`;
        }

        function tab(name, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');
            btn.classList.add('active');
            if (name === 'inv') drawInv();
            if (name === 'tasks') drawTasks();
        }

        function drawCases() {
            document.getElementById('cases-grid').innerHTML = allCases.map(c => `
                <div class="box-card" style="--c: ${c.color}" onclick="openCase('${c.id}')">
                    <div class="box-icon">${c.icon}</div>
                    <div class="box-title">${c.name}</div>
                    <div class="box-price">${c.price} ⭐</div>
                </div>
            `).join('');
        }

        let win = null;
        let cost = 0;

        function openCase(id) {
            let c = allCases.find(x => x.id === id);
            if (p.bal < c.price) return alert('Мало звезд!');
            p.bal -= c.price; cost = c.price; upd();
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-roll').classList.add('active');
            document.getElementById('roll-title').innerText = `Открываем: ${c.name}`;
            document.getElementById('claim-btn').classList.add('hidden');
            
            let track = document.getElementById('track');
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            
            // Крутим 40 элементов
            for (let i = 0; i < 40; i++) {
                let randDrop = c.drops[Math.floor(Math.random() * c.drops.length)];
                track.innerHTML += `
                    <div class="roll-item">
                        <div class="nft-img" style="--c: ${c.color}">${randDrop.emoji}</div>
                        <div class="nft-name" style="color: ${c.color}">${randDrop.name}</div>
                    </div>
                `;
            }
            
            // Наш выигрыш
            win = c.drops[Math.floor(Math.random() * c.drops.length)];
            let wIdx = 35;
            track.children[wIdx].innerHTML = `
                <div class="nft-img" style="--c: #fff; box-shadow: 0 0 20px #fff;">${win.emoji}</div>
                <div class="nft-name" style="color: #fff">${win.name}</div>
            `;
            track.children[wIdx].style.border = '2px solid #fff';
            
            setTimeout(() => {
                let w = track.parentElement.offsetWidth;
                let itemW = 120;
                let center = (w / 2) - (itemW / 2);
                let stop = -((wIdx * itemW) - center);
                track.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
                track.style.transform = `translateX(${stop}px)`;
            }, 50);
            
            setTimeout(() => {
                document.getElementById('claim-btn').classList.remove('hidden');
            }, 4100);
        }

        function claim() {
            p.inv.push({ name: win.name, emoji: win.emoji, val: cost });
            p.xp += Math.floor(cost / 2);
            
            if (p.xp >= p.lvl * 100) {
                p.xp -= p.lvl * 100;
                p.lvl++;
                p.bal += p.lvl * 50;
                alert('Новый уровень! Бонус: ' + (p.lvl * 50) + '⭐');
            }
            upd();
            alert(`Вы получили NFT: ${win.name}!`);
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-cases').classList.add('active');
            document.querySelectorAll('.nav-btn')[0].classList.add('active');
        }

        function drawInv() {
            if (p.inv.length === 0) {
                document.getElementById('inv-grid').innerHTML = '<p style="grid-column:span 2; text-align:center; color:#666;">Пусто</p>';
                return;
            }
            document.getElementById('inv-grid').innerHTML = p.inv.map((item, i) => `
                <div class="inv-item">
                    <div class="nft-img">${item.emoji}</div>
                    <div class="box-title" style="margin-top:5px;">${item.name}</div>
                    <button class="sell-btn" onclick="sell(${i})">Продать ${Math.floor(item.val * 0.5)} ⭐</button>
                </div>
            `).join('');
        }

        function sell(i) {
            p.bal += Math.floor(p.inv[i].val * 0.5);
            p.inv.splice(i, 1);
            upd();
            drawInv();
        }

        let tasks = [
            { t: 'Открой 5 кейсов', max: 5, cur: 0, rew: 100 },
            { t: 'Собери 10 NFT', max: 10, cur: 0, rew: 200 }
        ];

        function drawTasks() {
            document.getElementById('tasks-list').innerHTML = tasks.map(x => `
                <div class="task">
                    <div>
                        <div style="font-weight:bold; margin-bottom:5px;">${x.t}</div>
                        <div style="font-size:12px; color:#888;">${x.cur}/${x.max}</div>
                    </div>
                    <div style="color:#fbbf24; font-weight:bold;">+${x.rew} ⭐</div>
                </div>
            `).join('');
        }

        function promo() {
            let val = document.getElementById('promo').value.toUpperCase();
            if (val === 'SHARF' && !p.promo) {
                p.promo = true;
                p.bal += 2000;
                upd();
                alert('Промокод активирован! +2000 ⭐');
                document.getElementById('promo').value = '';
            } else {
                alert('Неверный код или уже использован!');
            }
        }

        drawCases();
        upd();
    </script>
</body>
</html>
