<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Universe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #151520;
            --border: #2a2a3e;
            --accent: #8b5cf6;
            --text: #ffffff;
            --gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 70px; }
        .hidden { display: none !important; }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .user-level { display: flex; align-items: center; gap: 10px; }
        .lvl-badge { background: var(--accent); padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .xp-bar { width: 80px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .xp-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
        .balance-box { background: #252536; padding: 8px 16px; border-radius: 20px; font-weight: bold; color: var(--gold); border: 1px solid #3e3e5e; }

        /* Экраны */
        .screen { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 15px; }

        /* СЕТКА КЕЙСОВ (3D ЯЩИКИ) */
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px; }
        .case-card { background: var(--panel); border-radius: 16px; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; position: relative; }
        .case-card:active { transform: scale(0.96); }
        
        /* 3D Ящик на CSS */
        .case-box { width: 80px; height: 70px; position: relative; margin-bottom: 15px; perspective: 100px; }
        .box-body { width: 100%; height: 100%; position: absolute; bottom: 0; border-radius: 8px; border: 2px solid var(--box-color); background: linear-gradient(180deg, #1f1f2e, #0d0d14); box-shadow: inset 0 0 15px var(--box-color), 0 0 15px var(--box-color); display: flex; justify-content: center; align-items: center; font-size: 30px; }
        .box-lid { width: 104%; height: 20px; position: absolute; top: 0; left: -2%; border-radius: 6px; border: 2px solid var(--box-color); background: #151520; box-shadow: 0 0 10px var(--box-color); z-index: 2; }
        .box-stripe { width: 20px; height: 100%; background: var(--box-color); position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); opacity: 0.3; }

        .case-name { font-weight: 700; font-size: 13px; margin-bottom: 5px; text-align: center; }
        .case-price { background: #252536; padding: 4px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; color: var(--gold); }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-btn { background: none; border: none; color: #9ca3af; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-btn.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }

        /* РУЛЕТКА */
        .roulette-wrapper { background: #000; border-radius: 16px; height: 120px; position: relative; overflow: hidden; margin: 30px 0; border: 2px solid var(--accent); }
        .roulette-marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ef4444; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 10px #ef4444; }
        .roulette-track { display: flex; align-items: center; height: 100%; position: absolute; }
        .roulette-item { min-width: 100px; height: 100px; margin: 0 5px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--panel); border: 1px solid #333; }
        
        /* NFT КАРТОЧКИ (Как в Telegram) */
        .nft-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; background: #000; border: 2px solid var(--nft-color); box-shadow: 0 0 15px var(--nft-color); margin-bottom: 5px; }
        .nft-name { font-size: 10px; font-weight: bold; text-align: center; }

        /* ИНВЕНТАРЬ */
        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .inv-card { background: var(--panel); border-radius: 16px; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
        .inv-card .nft-icon { width: 70px; height: 70px; font-size: 35px; }
        .inv-sell-btn { background: #ef4444; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; width: 100%; margin-top: 10px; }

        /* ЗАДАНИЯ И ПРОФИЛЬ */
        .task-card { background: var(--panel); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .task-info h4 { font-size: 14px; margin-bottom: 4px; }
        .task-reward { color: var(--gold); font-weight: bold; }
        .profile-box { background: var(--panel); border-radius: 16px; padding: 20px; border: 1px solid var(--border); text-align: center; margin-bottom: 20px; }
        .promo-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); color: white; border-radius: 8px; margin-top: 10px; text-align: center; }
        .btn { background: linear-gradient(135deg, var(--accent), #6d28d9); color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="user-level">
            <div class="lvl-badge" id="user-level">Ур. 1</div>
            <div style="display:flex; flex-direction:column; font-size:11px;">
                <span>Опыт</span>
                <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
            </div>
        </div>
        <div class="balance-box"><span id="balance">1000</span> ⭐</div>
    </header>

    <div class="screen active" id="screen-cases">
        <h2 class="section-title">Кейсы</h2>
        <div class="cases-grid" id="cases-grid"></div>
    </div>

    <div class="screen" id="screen-roulette">
        <h2 class="section-title" id="current-case-name">Открываем...</h2>
        <div class="roulette-wrapper">
            <div class="roulette-marker"></div>
            <div class="roulette-track" id="roulette-track"></div>
        </div>
        <button class="btn hidden" id="claim-btn" onclick="finishOpening()">Забрать NFT</button>
    </div>

    <div class="screen" id="screen-inv">
        <h2 class="section-title">Инвентарь</h2>
        <div class="inventory-grid" id="inventory-grid"></div>
    </div>

    <div class="screen" id="screen-tasks">
        <h2 class="section-title">Задания</h2>
        <div id="tasks-list"></div>
    </div>

    <div class="screen" id="screen-profile">
        <h2 class="section-title">Профиль</h2>
        <div class="profile-box">
            <h3>Ввести промокод</h3>
            <input type="text" class="promo-input" id="promo-input" placeholder="Введите код...">
            <button class="btn" onclick="redeemPromo()">Активировать</button>
        </div>
        <div class="profile-box">
            <h3>Трейды</h3>
            <button class="btn" style="background:#2a2a3e;" onclick="alert('Трейды появятся, когда мы подключим сервер!')">Открыть Трейды</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('cases', this)"><span class="nav-icon">📦</span>Кейсы</button>
        <button class="nav-btn" onclick="switchTab('inv', this)"><span class="nav-icon">🎒</span>Инвентарь</button>
        <button class="nav-btn" onclick="switchTab('tasks', this)"><span class="nav-icon">📋</span>Задания</button>
        <button class="nav-btn" onclick="switchTab('profile', this)"><span class="nav-icon">👤</span>Профиль</button>
    </nav>

    <script>
        let player = { balance: 1000, xp: 0, level: 1, inventory: [], casesOpened: 0, promoUsed: false };

        // ЦВЕТА И НАЗВАНИЯ ДЛЯ NFT
        const nftThemes = {
            black: { name: 'Черный', color: '#6b7280', emoji: '🌑' },
            white: { name: 'Белый', color: '#f3f4f6', emoji: '🌟' },
            red: { name: 'Красный', color: '#ef4444', emoji: '🔥' },
            blue: { name: 'Синий', color: '#3b82f6', emoji: '💧' },
            green: { name: 'Зеленый', color: '#10b981', emoji: '🌿' },
            gold: { name: 'Золотой', color: '#fbbf24', emoji: '👑' }
        };
        const rarities = ['Обычный', 'Необычный', 'Редкий', 'Эпический', 'Легендарный'];
        
        // КРУТЫЕ НАЗВАНИЯ ДЛЯ КЕЙСОВ
        const customCaseNames = {
            black: ['Ящик Мрака', 'Ящик Теней', 'Ящик Бездны', 'Ящик Демона', 'Ящик Космоса'],
            white: ['Ящик Облаков', 'Ящик Снега', 'Ящик Ангела', 'Ящик Света', 'Ящик Божества'],
            red: ['Ящик Искры', 'Ящик Пламени', 'Ящик Вулкана', 'Ящик Дракона', 'Ящик Ада'],
            blue: ['Ящик Капли', 'Ящик Льда', 'Ящик Моря', 'Ящик Глубин', 'Ящик Кристалла'],
            green: ['Ящик Травы', 'Ящик Леса', 'Ящик Яда', 'Ящик Мутанта', 'Ящик Древних'],
            gold: ['Ящик Бронзы', 'Ящик Серебра', 'Ящик Золота', 'Ящик Короля', 'Ящик Императора']
        };

        // ГЕНЕРАТОР 30 КЕЙСОВ
        const cases = [];
        let idCounter = 1;
        Object.keys(nftThemes).forEach(themeKey => {
            const theme = nftThemes[themeKey];
            for(let i=0; i<5; i++) {
                const price = Math.floor(25 * Math.pow(2.5, i)) + (themeKey === 'gold' ? 500 : 0);
                cases.push({
                    id: idCounter++,
                    name: customCaseNames[themeKey][i],
                    theme: themeKey,
                    color: theme.color,
                    price: price,
                    rarity: rarities[i]
                });
            }
        });

        const tasks = [
            { id: 'd1', text: 'Открой 5 кейсов', target: 5, reward: 100, type: 'open', current: 0 },
            { id: 'd2', text: 'Продай 3 NFT', target: 3, reward: 50, type: 'sell', current: 0 },
            { id: 'a1', text: 'Собери 10 NFT', target: 10, reward: 200, type: 'inv', current: 0 }
        ];

        function updateUI() {
            document.getElementById('balance').innerText = player.balance;
            document.getElementById('user-level').innerText = `Ур. ${player.level}`;
            const xpNeeded = player.level * 100;
            document.getElementById('xp-fill').style.width = `${Math.min(100, (player.xp / xpNeeded) * 100)}%`;
            if (player.promoUsed) {
                document.getElementById('promo-input').disabled = true;
                document.getElementById('promo-input').placeholder = "Код активирован";
            }
        }

        function addXP(amount) {
            player.xp += amount;
            const xpNeeded = player.level * 100;
            if (player.xp >= xpNeeded) {
                player.xp -= xpNeeded;
                player.level++;
                player.balance += player.level * 50;
                alert(`🎉 Новый уровень! Вы достигли Ур. ${player.level} и получили ${player.level * 50} ⭐`);
            }
            updateUI();
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`screen-${tab}`).classList.add('active');
            btn.classList.add('active');

            if (tab === 'inv') renderInventory();
            if (tab === 'tasks') renderTasks();
        }

        // РЕНДЕР ЯЩИКОВ
        function renderCases() {
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = cases.map(c => `
                <div class="case-card" style="--box-color: ${c.color};" onclick="startOpening(${c.id})">
                    <div class="case-box">
                        <div class="box-lid"></div>
                        <div class="box-body">
                            <div class="box-stripe"></div>
                            📦
                        </div>
                    </div>
                    <div class="case-name">${c.name}</div>
                    <div class="case-price">${c.price} ⭐</div>
                </div>
            `).join('');
        }

        let currentWin = null;
        let currentCasePrice = 0;

        function startOpening(id) {
            const c = cases.find(x => x.id === id);
            if (player.balance < c.price) return alert('Недостаточно звезд!');
            
            player.balance -= c.price;
            currentCasePrice = c.price;
            updateUI();
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-roulette').classList.add('active');
            document.getElementById('current-case-name').innerText = `Открываем: ${c.name}`;
            document.getElementById('claim-btn').classList.add('hidden');

            const track = document.getElementById('roulette-track');
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';

            const theme = nftThemes[c.theme];

            // Крутим 40 NFT карточек
            for (let i = 0; i < 40; i++) {
                const el = document.createElement('div');
                el.className = 'roulette-item';
                el.innerHTML = `
                    <div class="nft-icon" style="--nft-color: ${theme.color};">${theme.emoji}</div>
                    <div class="nft-name" style="color:${theme.color}">${c.rarity}</div>
                `;
                track.appendChild(el);
            }

            // Наш выигрыш
            currentWin = { name: c.name, rarity: c.rarity, value: c.price, theme: c.theme, emoji: theme.emoji };
            
            // Подсвечиваем выигрышный элемент (35-й)
            const winIndex = 35;
            track.children[winIndex].style.transform = 'scale(1.1)';
            track.children[winIndex].style.border = '2px solid #fff';
            track.children[winIndex].style.boxShadow = '0 0 20px #fff';

            setTimeout(() => {
                const itemWidth = 110;
                const centerOffset = (track.parentElement.offsetWidth / 2) - (itemWidth / 2);
                const stopPos = -((winIndex * itemWidth) - centerOffset);
                track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
                track.style.transform = `translateX(${stopPos}px)`;
            }, 50);

            setTimeout(() => {
                document.getElementById('claim-btn').classList.remove('hidden');
            }, 4200);
        }

        function finishOpening() {
            player.inventory.push(currentWin);
            player.casesOpened++;
            addXP(Math.floor(currentCasePrice / 2));
            checkTaskProgress('open', 1);
            
            alert(`Вы выиграли NFT: ${currentWin.emoji} ${currentWin.name}!`);
            
            // Возвращаемся на главную
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-cases').classList.add('active');
            document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
        }

        // ИНВЕНТАРЬ
        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            if (player.inventory.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; color: #666; text-align:center;">Пусто. Открывай кейсы!</p>';
                return;
            }
            grid.innerHTML = player.inventory.map((item, i) => {
                const t = nftThemes[item.theme];
                return `
                <div class="inv-card">
                    <div class="nft-icon" style="--nft-color: ${t.color};">${t.emoji}</div>
                    <div style="font-size:12px; font-weight:bold; text-align:center; margin-top:5px;">${item.name}</div>
                    <div style="font-size:10px; color:#888; margin:4px 0;">${item.rarity}</div>
                    <button class="inv-sell-btn" onclick="sellItem(${i})">Продать ${Math.floor(item.value * 0.5)} ⭐</button>
                </div>`;
            }).join('');
        }

        function sellItem(index) {
            const item = player.inventory[index];
            if(confirm(`Продать ${item.name} за ${Math.floor(item.value * 0.5)} ⭐?`)) {
                player.balance += Math.floor(item.value * 0.5);
                player.inventory.splice(index, 1);
                checkTaskProgress('sell', 1);
                updateUI();
                renderInventory();
            }
        }

        // ЗАДАНИЯ
        function renderTasks() {
            document.getElementById('tasks-list').innerHTML = tasks.map(t => `
                <div class="task-card">
                    <div class="task-info">
                        <h4>${t.text}</h4>
                        <div style="font-size:12px; color:#888;">Прогресс: ${t.current}/${t.target}</div>
                    </div>
                    <div class="task-reward">+${t.reward} ⭐</div>
                </div>
            `).join('');
        }

        function checkTaskProgress(type, amount) {
            let completed = false;
            tasks.forEach(t => {
                if(t.type === type && t.current < t.target) {
                    t.current += amount;
                    if(t.current >= t.target) {
                        player.balance += t.reward;
                        completed = true;
                    }
                }
            });
            if(completed) {
                updateUI();
                alert('🎁 Вы выполнили задание и получили награду!');
            }
        }

        // ПРОМОКОД
        function redeemPromo() {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            if(code === 'SHARF' && !player.promoUsed) {
                player.promoUsed = true;
                player.balance += 2000;
                addXP(100);
                alert('✅ Промокод активирован! Вы получили 2000⭐ и 100 XP.');
                updateUI();
                document.getElementById('promo-input').value = '';
            } else if (player.promoUsed) {
                alert('Вы уже использовали этот промокод!');
            } else {
                alert('❌ Неверный промокод!');
            }
        }

        renderCases();
        updateUI();
    </script>
</body>
</html>
